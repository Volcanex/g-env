set -g mouse on
set -g set-clipboard on

# Force OSC 52 clipboard support on regardless of terminfo detection,
# so copy works in every session/window/pane, not just the first.
set -as terminal-features ',*:clipboard'

# Mouse drag copies to system clipboard via OSC 52
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
set -g default-terminal "tmux-256color"
set -g history-limit 10000

# Prefix: Ctrl+Space (doesn't clash with anything)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Intuitive splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# New windows keep current path
bind c new-window -c "#{pane_current_path}"

# Kill current session outright (forwarded from Ghostty's cmd+shift+w)
bind X kill-session

# Scrollback paging: Ghostty's cmd+↑/↓ send PageUp/PageDown. PageUp drops
# into copy-mode a page up; further presses keep paging; PageDown pages back
# down and auto-exits at the live bottom (-e).
bind -n PageUp copy-mode -eu

# Status bar
set -g status-position bottom
set -g status-style bg=black,fg=white
set -g window-status-current-style bold,fg=cyan
set -g status-right "%H:%M"
